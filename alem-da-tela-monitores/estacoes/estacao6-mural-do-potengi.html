<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E se a tecnologia ajudasse o Potengi a…? · Além da Tela</title>
<style>
  :root{ --ink:#14213D; --muted:#5B6478; --bg:#F3F6FF; --panel:rgba(255,255,255,.9); --line:rgba(20,33,61,.12); --ai:#A78BFA; --cyan:#22D3EE; --pink:#F472B6; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#E6EBF7}
  body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #app{width:1600px;height:900px;flex:none;position:relative;transform-origin:center center;overflow:hidden;
    background:radial-gradient(900px 600px at 85% -10%,rgba(167,139,250,.28),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(34,211,238,.25),transparent 60%),var(--bg)}
  #app::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(70,90,200,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(70,90,200,.08) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 85%)}
  #app::after{content:"";position:absolute;left:0;right:0;height:180px;top:-180px;background:linear-gradient(transparent,rgba(34,211,238,.06),transparent);animation:scan 7s linear infinite;pointer-events:none}
  @keyframes scan{to{top:110%}}
  header{position:absolute;left:36px;right:36px;top:22px;height:78px;display:flex;align-items:center;gap:16px;z-index:5}
  header h1{margin:0;font-size:42px;letter-spacing:-.01em;background:linear-gradient(90deg,#14213D 0%,#6D28D9 55%,#0891B2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:4px 0 0;font-size:20px;color:var(--muted);font-weight:600}
  header .sp{flex:1}
  .count{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#22D3EE);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(109,40,217,.3),inset 0 0 0 3px rgba(255,255,255,.35);flex:none}
  .count b{font-size:32px;line-height:1;font-weight:900}
  .count span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-top:2px}
  .count.bump{animation:bump .5s ease}
  @keyframes bump{40%{transform:scale(1.18)}}
  .hbtn{border:1px solid var(--line);background:var(--panel);border-radius:14px;height:50px;padding:0 18px;font-size:18px;font-weight:800;backdrop-filter:blur(6px)}
  .hbtn:hover{border-color:#7C3AED}
  .hbtn.icon{width:50px;padding:0;font-size:22px}

  #mapwrap{position:absolute;left:20px;right:20px;top:108px;bottom:14px;display:flex;align-items:center;justify-content:center}
  #mapbox{position:relative;flex:none;transform-origin:center center}
  #mapbox svg{position:absolute;left:0;top:0;overflow:visible}
  .reg{cursor:pointer;transition:filter .25s, opacity .25s;filter:saturate(1.3) brightness(1.06) drop-shadow(0 6px 12px rgba(60,50,160,.18));}
  .reg.blink{animation:blink 1.8s ease-in-out}
  @keyframes blink{0%,100%{filter:saturate(1.3) brightness(1.06) drop-shadow(0 6px 12px rgba(60,50,160,.18))}45%{filter:saturate(1.5) brightness(1.4) drop-shadow(0 0 16px rgba(255,255,255,.85))}}
  @keyframes twinkle{0%,100%{filter:saturate(1.3) brightness(1.04) drop-shadow(0 6px 12px rgba(60,50,160,.18))}50%{filter:saturate(1.45) brightness(1.16) drop-shadow(0 6px 14px rgba(60,50,160,.22))}}
  .sheen{display:none}
  .reg:hover{animation:none;filter:brightness(1.3) saturate(1.5)}
  .reg.sel{animation:none;filter:brightness(1.35) saturate(1.3) drop-shadow(0 0 18px rgba(255,255,255,.9))}
  .reg.flash{animation:flash 1.1s ease}
  @keyframes flash{0%{filter:brightness(2.2)}100%{filter:none}}
  .linesimg{display:none;pointer-events:none;filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 8px 16px rgba(60,50,160,.25))}
  .outerb{display:none;fill:none;stroke:#8A93A6;stroke-width:7;stroke-linejoin:round;pointer-events:none}
  .net line{stroke:rgba(255,255,255,.35);stroke-width:1.5;stroke-dasharray:4 8;animation:dash 3s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .node{fill:#fff;filter:drop-shadow(0 0 6px #22D3EE)}
  .node.pulse{animation:pulse 2.4s ease-out infinite;fill:none;stroke:#fff;stroke-width:2}
  @keyframes pulse{0%{r:6;opacity:.9}100%{r:26;opacity:0}}
  .lbl{font-weight:500;font-size:22px;letter-spacing:.01em;fill:rgba(255,255,255,.96);text-anchor:middle;pointer-events:auto;cursor:pointer;paint-order:stroke;stroke:rgba(7,11,30,.28);stroke-width:2.5px;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(7,11,30,.35))}
  .lbl:hover{fill:#FDE68A}
  .badge{pointer-events:none;display:none !important}
  .badge rect{fill:#14213D;stroke:#fff;stroke-width:2.5}
  .badge text{fill:#fff;font-weight:800;font-size:16px;text-anchor:middle}
  #notes{position:absolute;inset:0;pointer-events:none;z-index:2}
  #labels{pointer-events:none;z-index:3}

  .postit{position:absolute;width:24px;height:22px;padding:0;border-radius:2px;box-shadow:0 3px 6px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.35) inset;pointer-events:auto;cursor:pointer;color:#14213D;
    display:flex;flex-direction:column;gap:4px;transform:translate(-50%,-50%) rotate(var(--r));transition:transform .2s, box-shadow .2s}
  .postit:hover{transform:translate(-50%,-50%) rotate(0) scale(1.5);z-index:999 !important;box-shadow:0 14px 28px rgba(0,0,0,.5),0 0 22px rgba(255,255,255,.35)}
  .postit .tx,.postit .nm{display:none}
  .postit::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:rgba(20,33,61,.22);box-shadow:0 5px 0 rgba(20,33,61,.22),0 10px 0 rgba(20,33,61,.16)}
  .postit .txx{font-size:14px;line-height:1.25;font-weight:700;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .postit .nm{font-size:12px;font-weight:800;color:rgba(20,33,61,.6);margin-top:auto}
  .postit.new{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes drop{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(2.6);opacity:0;filter:brightness(1.8)}100%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1);opacity:1;filter:none}}
  .ripple{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);animation:rip 1s ease-out forwards;pointer-events:none;z-index:4}
  @keyframes rip{to{width:120px;height:120px;opacity:0;border-width:1px}}

  #form{position:absolute;top:120px;width:560px;background:#fff;border:1px solid rgba(167,139,250,.5);border-radius:26px;padding:26px 28px;box-shadow:0 24px 60px rgba(20,33,61,.25);z-index:20;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(10px);animation:fin .25s ease}
  @keyframes fin{from{opacity:0;transform:translateY(12px)}}
  #form[hidden]{display:none}
  #form .where{display:flex;align-items:center;gap:14px}
  #form .pin{width:50px;height:50px;border-radius:14px;flex:none;box-shadow:0 0 18px currentColor}
  #form .where b{font-size:30px;display:block;line-height:1.1}
  #form .where small{font-size:16px;color:var(--muted);font-weight:700}
  #form label{font-size:20px;font-weight:800}
  #form textarea{width:100%;height:170px;resize:none;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:22px;line-height:1.35;outline:none;background:#F6F8FF}
  #form textarea::placeholder,#form input::placeholder{color:#9AA3C0}
  #form textarea:focus,#form input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
  #form input{width:100%;height:56px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:21px;outline:none;background:#F6F8FF}
  #form .meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-weight:700;margin-top:-6px}
  #form .acts{display:flex;gap:12px;margin-top:4px}
  #form .acts button{border:0;border-radius:16px;height:62px;font-size:22px;font-weight:900}
  #cancel{background:#EEF1F8;flex:0 0 170px}
  #ok{background:linear-gradient(90deg,#7C3AED,#22D3EE);color:#fff;flex:1;box-shadow:0 0 24px rgba(34,211,238,.35)}
  #ok:disabled{opacity:.35;cursor:default;box-shadow:none}

  .tipbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;border:2px solid #7C3AED;color:#14213D;border-radius:999px;padding:12px 26px;font-size:21px;font-weight:700;z-index:6;pointer-events:none;transition:opacity .4s;box-shadow:0 8px 24px rgba(20,33,61,.15)}
  .tipbar.hide{opacity:0}

  .modal{position:absolute;inset:0;background:rgba(20,33,61,.4);z-index:40;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .modal[hidden]{display:none}
  .big{width:560px;min-height:380px;padding:40px 44px 30px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 50px rgba(255,255,255,.2);display:flex;flex-direction:column;gap:18px;transform:rotate(-1.5deg);color:#14213D}
  .big .rg{font-size:18px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(20,33,61,.6)}
  .big .tx{font-size:30px;line-height:1.35;font-weight:700;word-break:break-word}
  .big .nm{font-size:20px;font-weight:800;color:rgba(20,33,61,.65);margin-top:auto}
  .sheet{width:1180px;height:760px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px 34px;display:flex;flex-direction:column;gap:14px}
  .sheet h2{margin:0;font-size:32px;display:flex;align-items:center;gap:14px}
  .sheet h2 .sp{flex:1}
  .sheet .x{border:0;background:#EEF1F8;border-radius:12px;height:46px;padding:0 18px;font-size:18px;font-weight:800}
  .list{flex:1;overflow:auto;columns:3;column-gap:22px}
  .grp{break-inside:avoid;margin-bottom:18px}
  .grp h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
  .grp h3 i{width:14px;height:14px;border-radius:4px;display:inline-block}
  .grp p{margin:0 0 8px;font-size:17px;line-height:1.35;font-weight:600;background:#F6F8FF;border-left:4px solid var(--c);border-radius:8px;padding:8px 12px}
  .grp p small{display:block;color:var(--muted);font-weight:800;font-size:13px;margin-top:2px}
  .empty{color:var(--muted);font-size:20px;font-weight:700}
  .menu{width:520px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px 28px;display:flex;flex-direction:column;gap:12px}
  .menu h2{margin:0 0 4px;font-size:26px}
  .menu p{margin:0;font-size:16px;color:var(--muted);font-weight:600;line-height:1.4}
  .menu button{border:0;border-radius:14px;height:56px;font-size:19px;font-weight:800;background:#EEF1F8;text-align:left;padding:0 18px}
  .menu button.danger{background:#FDE7E5;color:#B42318}
  .menu button.close{background:linear-gradient(90deg,#7C3AED,#22D3EE);color:#fff;text-align:center}
</style>
</head>
<body>
<div id="fit"><div id="app">
  <header>
    <div><h1>E se a tecnologia ajudasse o Potengi a…?</h1><p>Clique no mapa e deixe a sua ideia no mural</p></div>
    <div class="sp"></div>
    <div class="count" title="ideias no mural"><b id="cnt">0</b><span id="cntL">ideias</span></div>
    <button class="hbtn" id="btnFull" title="tela cheia (tecla F)">⛶ Tela cheia</button>
    <button class="hbtn" id="btnList">Ver todas</button>
    <button class="hbtn icon" id="btnMenu" title="opções do monitor">⚙</button>
  </header>

  <div id="mapwrap"><div id="mapbox">
    <svg id="svg"></svg>
    <div id="notes"></div>
    <svg id="labels"></svg>
  </div></div>


  <div id="form" hidden>
    <div class="where"><div class="pin" id="fPin"></div><div><b id="fReg"></b><small>sua ideia vai para o mural</small></div></div>
    <label for="fTx">Aqui no Potengi, eu gostaria que a tecnologia ajudasse a:</label>
    <textarea id="fTx" maxlength="140" placeholder="Escreva aqui a sua ideia"></textarea>
    <div class="meta"><span>Escreva uma ideia curta</span><span id="fLeft">140</span></div>
    <input id="fNm" maxlength="30" placeholder="Seu nome (opcional)">
    <div class="acts"><button id="cancel">Cancelar</button><button id="ok" disabled>OK, colar no mural</button></div>
  </div>

  <div class="modal" id="zoom" hidden><div class="big" id="bigNote"><div class="rg" id="zR"></div><div class="tx" id="zT"></div><div class="nm" id="zN"></div></div></div>

  <div class="modal" id="listM" hidden><div class="sheet">
    <h2>Todas as ideias <span class="sp"></span><button class="x" id="listX">Fechar</button></h2>
    <div class="list" id="list"></div>
  </div></div>

  <div class="modal" id="menuM" hidden><div class="menu">
    <h2>Opções do monitor</h2>
    <p>As ideias ficam guardadas neste navegador, mesmo se a página for fechada.</p>
    <button id="mCsv">⬇ Baixar as ideias (planilha .csv)</button>
    <button id="mUndo">↶ Tirar a última ideia</button>
    <button class="danger" id="mClear">Apagar todas as ideias</button>
    <button class="close" id="mClose">Fechar</button>
  </div></div>
</div></div>

    document.getElementById('cnt').textContent=notes.length; document.getElementById('cntL').textContent=notes.length===1?'ideia':'ideias';
    var per={}; notes.forEach(function(n){ per[n.reg]=(per[n.reg]||0)+1; });
    Object.keys(badges).forEach(function(k){ var b=badges[k]; if(per[k]){ b.g.style.display=''; b.t.textContent=per[k]+(per[k]===1?' ideia':' ideias'); var w=b.t.textContent.length*9+22; b.c.setAttribute('width',w); b.c.setAttribute('x',-w/2+w/2+8); b.t.setAttribute('x',w/2+8); } else b.g.style.display='none'; });
  }

  /* ---------- formulário ---------- */
  var form=document.getElementById('form'), fTx=document.getElementById('fTx'), fNm=document.getElementById('fNm'), okB=document.getElementById('ok'), cur=null;
  function formOpen(){ return !form.hidden; }
  function openForm(r){
    if(cur) regEls[cur.name].classList.remove('sel');
    cur=r; regEls[r.name].classList.add('sel');
    document.getElementById('fReg').textContent=r.name; var pc=PAL[r.name]; var pin=document.getElementById('fPin'); pin.style.background='linear-gradient(135deg,'+pc[0]+','+pc[1]+')'; pin.style.color=pc[0]; form.style.borderColor=pc[0];
    var left = r.lx > MAP.w*0.5;
    form.style.left = left ? '40px' : ''; form.style.right = left ? '' : '40px';
    form.hidden=false;
    setTimeout(function(){ fTx.focus(); },30);
  }
  function closeForm(){ if(cur) regEls[cur.name].classList.remove('sel'); cur=null; form.hidden=true; fTx.value=''; fNm.value=''; upd(); updateCounts(); }
  function upd(){ var n=fTx.value.trim().length; okB.disabled=n<3; document.getElementById('fLeft').textContent=140-fTx.value.length; }
  fTx.addEventListener('input',upd);
  document.getElementById('cancel').addEventListener('click',closeForm);
  okB.addEventListener('click',function(){
    var t=fTx.value.trim().replace(/\s+/g,' '); if(t.length<3||!cur) return;
    var p=spot(cur), n={reg:cur.name,t:t,n:fNm.value.trim(),x:Math.round(p[0]),y:Math.round(p[1]),r:Math.round((Math.random()-.5)*12),c:COLORS[notes.length%COLORS.length],at:new Date().toISOString()};
    notes.push(n); save();
    notesEl.appendChild(noteEl(n,notes.length-1,true)); var rp=document.createElement('div'); rp.className='ripple'; rp.style.left=n.x+'px'; rp.style.top=n.y+'px'; notesEl.appendChild(rp); setTimeout(function(){ rp.remove(); },1100);
    var reg=regEls[cur.name]; closeForm(); reg.classList.remove('flash'); void reg.getBBox(); reg.classList.add('flash');
    updateCounts(); var ce=document.querySelector('.count'); ce.classList.remove('bump'); void ce.offsetWidth; ce.classList.add('bump');
  });
  fTx.addEventListener('keydown',function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!okB.disabled) okB.click(); } });
  fNm.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(!okB.disabled) okB.click(); } });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(formOpen()) closeForm(); ['zoom','listM','menuM'].forEach(function(id){ document.getElementById(id).hidden=true; }); } });

  /* ---------- zoom, lista, menu ---------- */
  var zoom=document.getElementById('zoom');
  function showZoom(n){ document.getElementById('bigNote').style.background=n.c; document.getElementById('zR').textContent=n.reg; document.getElementById('zT').textContent=n.t; document.getElementById('zN').textContent=n.n?('— '+n.n):''; zoom.hidden=false; }
  zoom.addEventListener('click',function(){ zoom.hidden=true; });
  var listM=document.getElementById('listM');
  document.getElementById('btnList').addEventListener('click',function(){
    var L=document.getElementById('list'); L.innerHTML='';
    if(!notes.length){ L.innerHTML='<div class="empty">Nenhuma ideia ainda. Seja o primeiro!</div>'; }
    MAP.regions.map(function(r){ return r.name; }).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); }).forEach(function(name){
      var its=notes.filter(function(n){ return n.reg===name; }); if(!its.length) return;
      var g=document.createElement('div'); g.className='grp'; g.style.setProperty('--c',PAL[name][0]); g.innerHTML='<h3><i style="background:'+PAL[name][0]+'"></i>'+esc(name)+' ('+its.length+')</h3>'+its.map(function(n){ return '<p>'+esc(n.t)+(n.n?'<small>'+esc(n.n)+'</small>':'')+'</p>'; }).join('');
      L.appendChild(g);
    });
    listM.hidden=false;
  });
  document.getElementById('listX').addEventListener('click',function(){ listM.hidden=true; });
  listM.addEventListener('click',function(e){ if(e.target===listM) listM.hidden=true; });
  var menuM=document.getElementById('menuM'), clearArmed=false, mClear=document.getElementById('mClear');
  document.getElementById('btnMenu').addEventListener('click',function(){ clearArmed=false; mClear.textContent='Apagar todas as ideias'; menuM.hidden=false; });
  document.getElementById('mClose').addEventListener('click',function(){ menuM.hidden=true; });
  menuM.addEventListener('click',function(e){ if(e.target===menuM) menuM.hidden=true; });
  document.getElementById('mUndo').addEventListener('click',function(){ notes.pop(); save(); renderAll(); menuM.hidden=true; });
  mClear.addEventListener('click',function(){
    if(!clearArmed){ clearArmed=true; mClear.textContent='Tem certeza? Clique de novo para apagar tudo'; return; }
    notes=[]; save(); renderAll(); menuM.hidden=true;
  });
  document.getElementById('mCsv').addEventListener('click',function(){
    var rows=[['município','ideia','nome','data e hora']].concat(notes.map(function(n){ return [n.reg,n.t,n.n,new Date(n.at).toLocaleString('pt-BR')]; }));
    var csv='﻿'+rows.map(function(r){ return r.map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; }).join(';'); }).join('\r\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='ideias-potengi.csv'; document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById('mapwrap').addEventListener('click',function(e){ if(e.target.closest('#form')) return; });

  /* de vez em quando, alguns municípios piscam suavemente */
  (function loop(){
    var names=Object.keys(regEls), k=1+Math.floor(Math.random()*2);
    for(var j=0;j<k;j++){ var el=regEls[names[Math.floor(Math.random()*names.length)]];
      if(el.classList.contains('sel')||el.matches(':hover')) continue;
      el.classList.remove('blink'); void el.getBBox(); el.classList.add('blink');
      (function(e){ setTimeout(function(){ e.classList.remove('blink'); },1900); })(el); }
    setTimeout(loop, 2200+Math.random()*2600);
  })();
  /* tela cheia: botão, tecla F e no primeiro toque na tela */
  function goFull(){ try{ var d=document.documentElement; if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen).call(d); } }catch(err){} }
  function toggleFull(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else goFull(); }catch(err){} }
  var btnFull=document.getElementById('btnFull');
  btnFull.addEventListener('click',function(e){ e.stopPropagation(); toggleFull(); });
  document.addEventListener('fullscreenchange',function(){ btnFull.style.display=document.fullscreenElement?'none':''; setTimeout(fit,60); });
  document.addEventListener('keydown',function(e){ if((e.key==='f'||e.key==='F') && !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) toggleFull(); });
  document.addEventListener('pointerdown',function first(){ goFull(); document.removeEventListener('pointerdown',first,true); },true);
  window.addEventListener('resize',fit);
  load(); fit(); renderAll();
})();
</script>
</body>
</html>
